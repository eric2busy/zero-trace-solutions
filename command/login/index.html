<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in — Zero Trace Command</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef6ff;color:#262626;font-family:system-ui,sans-serif}.card{width:min(390px,calc(100% - 40px));background:#fff;border:1px solid #d3d3d3;border-radius:22px;padding:30px;box-shadow:0 16px 45px #26262614}h1{margin:0 0 8px;font-size:28px}p{color:#6c6c6c;line-height:1.5;font-size:14px}label{display:grid;gap:6px;margin-top:16px;font-size:13px;font-weight:700}input{border:1px solid #bbb;border-radius:10px;padding:12px;font:inherit}button{width:100%;border:0;border-radius:999px;background:#0083f5;color:#fff;padding:13px;margin-top:22px;font:inherit;font-weight:700}.notice{display:none;background:#fff4df;color:#805000;border-radius:10px;padding:10px;font-size:13px}.notice.show{display:block}</style></head><body><main class="card"><img src="../../logo.svg" alt="Zero Trace Solutions" height="34"><h1>Command access</h1><p>Sign in with an Owner, Admin, Operator, or Technician account. Access is by invitation only.</p><p class="notice" id="notice" role="alert"></p><form method="post" action="/api/command-auth"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form></main><script>const e=new URLSearchParams(location.search).get('error'),m={invalid:'Enter a valid email and password.',access:'This account is not authorized for Command.',unavailable:'Sign-in is temporarily unavailable.'}[e];if(m){const n=document.getElementById('notice');n.textContent=m;n.className='notice show'}</script></body></html>
