name: Owner Production Gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 'Pull request number to reevaluate'
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  owner-approval:
    name: owner-production-approval
    runs-on: ubuntu-latest
    steps:
      - name: Set the exact-head owner Production gate
        uses: actions/github-script@v7
        with:
          script: |
            const requiredOwner = 'eric2busy';
            const contextName = 'owner-production-approval';
            const approvalPrefix = 'OWNER_PRODUCTION_APPROVED:';

            let pr;
            if (context.eventName === 'pull_request_target') {
              pr = context.payload.pull_request;
            } else if (context.eventName === 'issue_comment') {
              const issue = context.payload.issue;
              if (!issue?.pull_request) {
                core.notice('Comment is not on a pull request; nothing to do.');
                return;
              }
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: issue.number,
              });
              pr = response.data;
            } else {
              const pullNumber = context.payload.inputs.pull_request_number;
              if (!/^[1-9]\d*$/.test(pullNumber)) {
                core.setFailed('pull_request_number must be a positive integer.');
                return;
              }
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(pullNumber),
              });
              pr = response.data;
            }

            if (pr.state !== 'open') {
              core.notice('Pull request is not open; nothing to gate.');
              return;
            }

            const headSha = pr.head.sha;
            const expectedApproval = `${approvalPrefix} ${headSha}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const approved = comments.some((comment) =>
              comment.user?.login === requiredOwner &&
              comment.body.trim() === expectedApproval
            );

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: headSha,
              state: approved ? 'success' : 'failure',
              context: contextName,
              description: approved
                ? 'Owner approved this exact PR head for Production.'
                : 'Awaiting an exact-head owner approval.',
              target_url: pr.html_url,
            });

            if (!approved) {
              core.setFailed(
                `Production gate closed for ${headSha}. ` +
                `@${requiredOwner} must comment exactly: ${expectedApproval}`
              );
              return;
            }

            core.info(`Production gate open for exact head ${headSha}.`);
