<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Schedule a Walkthrough — Zero Trace</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#0083F5',dark:'#262626',muted:'#6C6C6C',border:'#D3D3D3'}}}}</script>
<style>@font-face{font-family:'Cal Sans';src:url(https://cdn.jsdelivr.net/fontsource/fonts/cal-sans@latest/latin-400-normal.woff2) format('woff2')}@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');body{font-family:Inter,system-ui,sans-serif}.font-display{font-family:'Cal Sans',Inter,system-ui,sans-serif}.soft-gradient-top{background:radial-gradient(ellipse 140% 90% at 15% -5%,rgba(0,131,245,.16) 0%,transparent 55%),linear-gradient(180deg,#eef6ff 0%,#fff 70%)}</style>
</head>
<body class="bg-white text-dark">
<header class="fixed top-0 left-0 right-0 z-50 px-4 pt-4"><div class="max-w-6xl mx-auto"><div class="flex items-center justify-between bg-white/80 backdrop-blur-md border border-border/50 rounded-full px-5 py-3 shadow-sm"><a href="/"><img src="/logo.svg" alt="Zero Trace" class="h-7 w-auto"/></a><div class="flex gap-3"><a href="/book.html" class="hidden sm:inline-flex px-4 py-2 bg-dark text-white text-sm rounded-full">Book</a><button id="menuBtn" class="w-8 h-8 flex items-center justify-center"><svg width="20" height="14" viewBox="0 0 20 14" fill="none"><path d="M1 1h18M1 7h18M1 13h18" stroke="#1E1E1E" stroke-width="2" stroke-linecap="round"/></svg></button></div></div></div></header>
<div id="mobileMenu" class="fixed inset-0 z-[60] bg-white flex-col items-center justify-center gap-8 text-xl font-medium hidden"><a href="/" class="menu-link">Home</a><a href="/about.html" class="menu-link">About</a><a href="/faq.html" class="menu-link">FAQ</a><a href="/contact.html" class="menu-link">Contact</a><a href="/book.html" class="menu-link px-6 py-3 bg-primary text-white rounded-full mt-2">Schedule Walkthrough</a><button id="closeMenu" class="absolute top-6 right-6 text-3xl">&times;</button></div>
<main class="soft-gradient-top min-h-screen pt-28 pb-16 px-5"><div class="max-w-xl mx-auto"><div class="text-center mb-8"><div class="text-xs font-bold tracking-wider text-primary mb-2">REQUEST A WALKTHROUGH</div><h1 class="font-display text-3xl md:text-4xl">Tell us about your space</h1><p class="text-muted mt-2">We’ll follow up shortly to confirm timing.</p></div>
<form id="walkthroughForm" class="space-y-4 bg-white p-6 md:p-8 rounded-2xl shadow-lg border border-border">
<div class="grid sm:grid-cols-2 gap-4"><div><label class="block text-xs text-muted mb-1">Full Name *</label><input type="text" name="name" required class="w-full px-4 py-3 rounded-xl border border-border"/></div><div><label class="block text-xs text-muted mb-1">Phone *</label><input type="tel" name="phone" required class="w-full px-4 py-3 rounded-xl border border-border"/></div></div>
<div><label class="block text-xs text-muted mb-1">Email *</label><input type="email" name="email" required class="w-full px-4 py-3 rounded-xl border border-border"/></div>
<div><label class="block text-xs text-muted mb-1">Business Type *</label><select name="businessType" required class="w-full px-4 py-3 rounded-xl border border-border bg-white"><option value="">Select…</option><option>Office</option><option>Classroom</option><option>Commercial</option><option>Other</option></select></div>
<div class="grid sm:grid-cols-2 gap-4"><div><label class="block text-xs text-muted mb-1">Preferred Date</label><input type="date" name="preferredDate" class="w-full px-4 py-3 rounded-xl border border-border"/></div><div><label class="block text-xs text-muted mb-1">Preferred Time</label><select name="preferredTime" class="w-full px-4 py-3 rounded-xl border border-border bg-white"><option>Morning</option><option>Afternoon</option><option>Flexible</option></select></div></div>
<div><label class="block text-xs text-muted mb-1">Location / City *</label><input type="text" name="location" required class="w-full px-4 py-3 rounded-xl border border-border"/></div>
<div><label class="block text-xs text-muted mb-1">Additional Notes</label><textarea name="notes" rows="3" class="w-full px-4 py-3 rounded-xl border border-border"></textarea></div>
<button type="submit" id="submitBtn" class="w-full py-4 bg-primary text-white rounded-full font-medium">Request Walkthrough</button>
<p id="formMessage" class="text-sm text-center hidden"></p>
</form></div></main>
<footer class="border-t border-border py-8 px-5"><div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4 text-sm text-muted"><a href="/"><img src="/logo.svg" alt="Zero Trace" class="h-6 w-auto"/></a><div>©2026 Zero Trace Solutions</div><a href="mailto:support@zerotraceusa.com">support@zerotraceusa.com</a></div></footer>
<script>
const menuBtn=document.getElementById('menuBtn'),mobileMenu=document.getElementById('mobileMenu'),closeMenu=document.getElementById('closeMenu');
function openMenu(){mobileMenu.classList.remove('hidden');mobileMenu.classList.add('flex');document.body.style.overflow='hidden'}
function closeMenuFn(){mobileMenu.classList.add('hidden');mobileMenu.classList.remove('flex');document.body.style.overflow=''}
menuBtn?.addEventListener('click',openMenu);closeMenu?.addEventListener('click',closeMenuFn);
document.querySelectorAll('.menu-link').forEach(l=>l.addEventListener('click',closeMenuFn));
const form=document.getElementById('walkthroughForm'),btn=document.getElementById('submitBtn'),msg=document.getElementById('formMessage');
form?.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Sending…';await new Promise(r=>setTimeout(r,800));form.reset();msg.textContent='Thanks — we’ll be in touch shortly.';msg.className='text-sm text-center text-green-600';msg.classList.remove('hidden');btn.disabled=false;btn.textContent='Request Walkthrough'});
</script>
</body></html>
